<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EVMate 授權</title>
<style>
  body { font: 16px -apple-system, sans-serif; margin: 0; padding: 24px 16px; background: #f3f0ea; color: #2e2b28; }
  @media (prefers-color-scheme: dark) { body { background: #1c1b19; color: #f3f0ea; } }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; font: 13px ui-monospace, monospace; padding: 8px; }
  button { margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 999px; background: #2e2b28; color: #fff; font-size: 16px; }
</style>
<main>
  <h1 id="title">複製下面的網址</h1>
  <p>貼回 Mac 終端機：<code>python3 tools/tesla/tesla_setup.py exchange '&lt;網址&gt;'</code></p>
  <textarea id="url" readonly></textarea>
  <button id="copy">複製</button>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const box = document.getElementById("url");
  if (params.get("error")) {
    document.getElementById("title").textContent = "授權失敗：" + params.get("error");
  }
  box.value = location.href;
  document.getElementById("copy").onclick = () => navigator.clipboard.writeText(box.value);
</script>
</html>
